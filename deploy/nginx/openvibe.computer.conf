## openvibe.computer — reference vhost for ov-vhost-install.
## Computer answers pages and /api/ on 127.0.0.1:5135. The facade forwards the caller's token to Run server-side.
limit_req_zone $binary_remote_addr zone=computer_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=computer_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.computer www.openvibe.computer;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.computer$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.computer;
    ssl_certificate /etc/letsencrypt/live/openvibe.computer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.computer/privkey.pem;
    return 301 https://openvibe.computer$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.computer;
    ssl_certificate /etc/letsencrypt/live/openvibe.computer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.computer/privkey.pem;
    access_log /var/log/nginx/openvibe.computer.access.log;
    error_log /var/log/nginx/openvibe.computer.error.log;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json text/plain;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /auth/me { limit_req zone=computer_api burst=30 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5135; }
    location /auth/ { limit_req zone=computer_auth burst=10 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5135; }
    location /api/ { limit_req zone=computer_api burst=20 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:5135; }
    location ~* ^/(metrics|internal)(/|$) { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location / { proxy_pass http://127.0.0.1:5135; }
}
